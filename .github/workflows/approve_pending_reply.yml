name: Approve Pending Proactive Reply

# Phase 4b manual approval surface. The ONLY workflow in the
# proactive-reply pipeline that ever posts to Bluesky. Fired manually
# via the Actions UI (workflow_dispatch only — no schedule).
#
# Defaults are deliberately the safest choice: action=reject, reason=manual.
# A user clicking "Run workflow" without changing anything just rejects
# the oldest pending draft.
#
# Kill-switch: disable this workflow in the Actions UI to make Phase 4b
# strictly read-only (drafts continue to stage; nothing posts).

on:
  workflow_dispatch:
    inputs:
      draft_id:
        description: 'Draft UUID, or "first" for the oldest pending draft'
        required: true
        default: 'first'
        type: string
      action:
        description: 'approve = posts to Bluesky; reject = moves to rejected'
        required: true
        default: 'reject'
        type: choice
        options:
          - approve
          - reject
      reject_reason:
        description: 'Optional reason (only used when action=reject)'
        required: false
        default: 'manual'
        type: string

# ONE concurrency group, shared with proactive_scan.yml (ledger X7). Both read
# pending_replies.json from the state Gist and write the whole file back with
# no compare-and-swap; overlapping, a scan could write back state it loaded
# before this approval finished and resurrect the approved draft. Not scoped
# per ref, because the Gist file is global. cancel-in-progress stays false so
# an approval is never cut off after posting but before recording it. GitHub
# keeps at most one PENDING run per group: a third trigger while one runs and
# one waits cancels the waiting one (shown as "cancelled"; re-run it).
concurrency:
  group: pending-replies-state
  cancel-in-progress: false

jobs:
  approve:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run approval action
        env:
          BLUESKY_USERNAME: ${{ secrets.BLUESKY_USERNAME }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
          DRAFT_ID: ${{ inputs.draft_id }}
          ACTION: ${{ inputs.action }}
          REJECT_REASON: ${{ inputs.reject_reason }}
        run: python -m scripts.run_proactive_approve
