name: Test Snapshot Gist Step (throwaway)

# Validates the daily_post.yml "Snapshot Gist state" logic in isolation,
# without triggering a bot post. Delete this workflow once the snapshot
# step runs green in the main workflow.

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install httpx
        run: pip install httpx

      - name: Snapshot Gist state (mirror of daily_post.yml)
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
        run: |
          mkdir -p backup
          python - <<'PY'
          import os, httpx
          gist_id = os.environ["GIST_ID"]
          token = os.environ["GIST_TOKEN"]
          resp = httpx.get(
              f"https://api.github.com/gists/{gist_id}",
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
              timeout=15,
          )
          print(f"Status: {resp.status_code}")
          resp.raise_for_status()
          files = resp.json()["files"]
          print(f"Files in gist: {list(files.keys())}")
          for name, f in files.items():
              with open(f"backup/{name}", "w", encoding="utf-8") as out:
                  out.write(f["content"])
          print(f"Wrote {len(files)} files to backup/")
          PY

      - name: List backup contents
        run: ls -la backup/
