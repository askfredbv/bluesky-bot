name: Voice Audit (monthly)

# An independent, Pro-tier Gemini critique of the bot's recent posts against
# Frederik's voice — surfaced as a GitHub issue for human review. NOT an
# auto-fixer: nothing is applied, the issue is a draft critique to weigh.
# Deliberately low-cadence (monthly) — voice drift is slow, and the point is
# a report you actually read, not plat bandwerk.
#
# The auditor is a Pro-tier model, different from the gemini-3.5-flash writer,
# so the critic's blind spots differ from the author's. See docs/VOICE_AUDIT.md.

on:
  workflow_dispatch:
  schedule:
    # 07:11 UTC on the 1st of each month (off-:00 to be polite to the API).
    - cron: "11 7 1 * *"

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run voice audit
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m scripts.run_voice_audit > audit_report.md

      - name: Open review issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "Voice audit — $(date -u +%Y-%m-%d)" \
            --body-file audit_report.md \
            --label "voice-audit" 2>/dev/null \
          || gh issue create \
            --title "Voice audit — $(date -u +%Y-%m-%d)" \
            --body-file audit_report.md
