name: Voice Audit (on demand)

# An independent, Pro-tier Gemini critique of the bot's recent posts against
# Frederik's voice — surfaced as a GitHub issue. NOT an auto-fixer: nothing is
# applied, the issue is a draft critique to weigh.
#
# MANUAL ONLY (workflow_dispatch). The primary cadence is a periodic evening
# REMINDER (a scheduled Claude session) that prepares the stronger manual
# cross-context Gemini audit — running Gemini yourself in a separate context
# is more independent than this Gemini-audits-near-Gemini auto-version. This
# workflow stays as the lazy fallback: one click for a quick auto-issue when
# you don't want to do the manual run. See docs/VOICE_AUDIT.md.
#
# The auditor is a Pro-tier model, different from the gemini-3.5-flash writer,
# so the critic's blind spots differ from the author's.

on:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run voice audit
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m scripts.run_voice_audit > audit_report.md

      - name: Open review issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "Voice audit — $(date -u +%Y-%m-%d)" \
            --body-file audit_report.md \
            --label "voice-audit" 2>/dev/null \
          || gh issue create \
            --title "Voice audit — $(date -u +%Y-%m-%d)" \
            --body-file audit_report.md
