name: Image Model Probe (diagnostic)

# Manual, read-only diagnostic. Runs scripts/probe_image_models.py with the
# production GEMINI_API_KEY to find which image model still returns image bytes,
# and to verify the request-level HttpOptions timeout the bot relies on. The
# bot's IMAGE_MODEL (gemini-3.1-flash-image) briefly went unreachable ~2026-08-26
# (silently stopping image generation on Mentor/Strategist posts) and was
# reachable again by 2026-08-31 — keep this as the standing check for the next
# time. Posts nothing, changes nothing. Same rationale as model-discovery.yml:
# the key is IP-restricted to the runners, so this is the only place the probe is
# truthful. Trigger from the Actions UI → "Run workflow".

#
# 2026-10-19: a `provider` input adds Cloudflare Workers AI (FLUX.1 Schnell).
# That choice is aesthetic, not technical — a byte count cannot tell you whether
# the images look right — so the probe now writes the generated files and this
# workflow uploads them as an artifact to be compared by eye. Rationale in
# docs/REVIEW_blubot_2026-10-19.md §C4. The Cloudflare secrets are optional:
# leave them unset and the default `gemini` run behaves exactly as before.

on:
  workflow_dispatch:
    inputs:
      provider:
        description: 'Which provider to probe'
        required: false
        default: 'gemini'
        type: choice
        options: [gemini, cloudflare, both]

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Probe image models
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python -m scripts.probe_image_models \
            --provider "${{ inputs.provider || 'gemini' }}" \
            --out probe-images

      # The point of the run: look at the pictures. Kept short-lived because
      # they are throwaway diagnostics, not a deliverable.
      - name: Upload generated images
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: probe-images-${{ inputs.provider || 'gemini' }}
          path: probe-images/
          retention-days: 7
          if-no-files-found: warn
