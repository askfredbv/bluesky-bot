name: Image Model Probe (diagnostic)

# Manual, read-only diagnostic. Runs scripts/probe_image_models.py with the
# production GEMINI_API_KEY to find which image model still returns image bytes,
# and to verify the request-level HttpOptions timeout the bot relies on. The
# bot's IMAGE_MODEL (gemini-3.1-flash-image) briefly went unreachable ~2026-08-26
# (silently stopping image generation on Mentor/Strategist posts) and was
# reachable again by 2026-08-31 — keep this as the standing check for the next
# time. Posts nothing, changes nothing. Same rationale as model-discovery.yml:
# the key is IP-restricted to the runners, so this is the only place the probe is
# truthful. Trigger from the Actions UI → "Run workflow".

#
# --out writes the images and this workflow uploads them as an artifact, to
# be compared by eye. The Cloudflare provider was removed on 2026-11-18.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'probe = which models are reachable; bakeoff = compare models on the real prompt'
        required: false
        default: 'probe'
        type: choice
        options: [probe, bakeoff]
      bakeoff_models:
        description: 'bakeoff only: comma-separated models (blank = live IMAGE_MODEL vs the Lite tier)'
        required: false
        default: ''
      topics:
        description: 'bakeoff only: how many Mentor topics to render per model'
        required: false
        default: '5'
      crafted:
        description: 'bakeoff only: send the real production prompt (model-written + constraints) instead of the static fallback'
        required: false
        default: false
        type: boolean

jobs:
  probe:
    environment: production
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Probe image models
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Dispatch inputs reach the shell ONLY as environment variables, never
          # as ${{ }} inside `run`. GitHub substitutes those expressions into the
          # script text before bash parses it, so a `topics` of $(curl …) would
          # execute here — in a step holding the Gemini key. Anyone who can dispatch the workflow
          # could exfiltrate it
          # without touching the reviewed file. (Codex P1, 2026-10-19.)
          MODE: ${{ inputs.mode }}
          TOPICS: ${{ inputs.topics }}
          BAKEOFF_MODELS: ${{ inputs.bakeoff_models }}
          CRAFTED: ${{ inputs.crafted }}
        run: |
          set -euo pipefail
          # An array, so every element stays one argument no matter what it holds.
          args=()
          if [ "${MODE:-probe}" = "bakeoff" ]; then
            # Costs real money (one image per topic per model), unlike the
            # reachability probe — keep the topic count small.
            args+=(--bakeoff --topics "${TOPICS:-5}")
            if [ -n "${BAKEOFF_MODELS:-}" ]; then
              args+=(--bakeoff-models "$BAKEOFF_MODELS")
            fi
            if [ "${CRAFTED:-false}" = "true" ]; then
              args+=(--crafted)
            fi
          fi
          python -m scripts.probe_image_models "${args[@]}" --out probe-images

      # The point of the run: look at the pictures. Kept short-lived because
      # they are throwaway diagnostics, not a deliverable.
      - name: Upload generated images
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: probe-images-${{ inputs.mode == 'bakeoff' && 'bakeoff' || 'gemini' }}
          path: probe-images/
          retention-days: 7
          if-no-files-found: warn
