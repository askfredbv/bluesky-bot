name: Dependency lockfile check

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'

      - name: Install pip-tools
        run: python -m pip install --upgrade pip pip-tools

      - name: Regenerate runtime lockfile
        run: pip-compile --quiet --no-header --no-annotate --strip-extras --output-file requirements.txt pyproject.toml

      - name: Regenerate dev lockfile
        run: pip-compile --quiet --no-header --no-annotate --strip-extras --extra dev --output-file requirements-dev.txt pyproject.toml

      - name: Upload regenerated lockfiles
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lockfiles
          path: |
            requirements.txt
            requirements-dev.txt

      - name: Verify lockfiles are up to date
        run: git diff --exit-code requirements.txt requirements-dev.txt
