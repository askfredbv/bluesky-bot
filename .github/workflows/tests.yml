name: Test Suite

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest-cov

      - name: Run tests with global coverage gate
        run: |
          pytest \
            --cov=main \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=70

      - name: Run stricter coverage gates for critical modules
        run: python scripts/check_critical_coverage.py

      - name: Enforce focused tests for critical-module changes
        if: github.event_name == 'pull_request'
        run: |
          python scripts/check_critical_test_changes.py \
            "${{ github.base_ref }}" \
            "${{ github.sha }}"

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            coverage.xml
