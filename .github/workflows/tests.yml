name: Test Suite

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest-cov mypy

      - name: Lint with ruff
        run: |
          ruff check src/ main.py scripts/ tests/

      # Type-check foothold: gate the modules that are already mypy-clean so
      # type regressions there fail the build. The remaining modules (agents,
      # main, net_safety, file_lock, broadcasters, utils, state_store, news)
      # have known type issues to fix incrementally; expand this list as they
      # go green. --follow-imports=silent keeps the gate scoped to these files.
      - name: Type-check (mypy, clean modules)
        run: |
          mypy --ignore-missing-imports --follow-imports=silent \
            src/config.py src/retry.py src/metrics.py src/proactive.py \
            src/settings.py src/logger.py src/bluesky_session.py

      - name: Run tests with global coverage gate
        run: |
          pytest \
            --cov=main \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=80

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-report
          path: |
            coverage.xml
