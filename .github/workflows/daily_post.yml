name: Daily Bluesky Post

on:
  # Triggered externally by cron-job.org at 08:00 and 14:30 UTC via workflow_dispatch.
  # GitHub's built-in schedule is intentionally removed to avoid duplicate posts and timing delays.
  workflow_dispatch:

concurrency:
  group: daily-post-${{ github.ref }}
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run daily post
        env:
          # Required
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BLUESKY_USERNAME: ${{ secrets.BLUESKY_USERNAME }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          # Optional Mastodon support
          MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
          MASTODON_API_BASE_URL: ${{ secrets.MASTODON_API_BASE_URL }}
          # Cap jitter to 5 min so the Actions runner doesn't idle for 30 min
          POST_JITTER_MIN_SECONDS: 30
          POST_JITTER_MAX_SECONDS: 300
        run: python main.py
