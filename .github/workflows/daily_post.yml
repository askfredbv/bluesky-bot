name: Daily Bluesky Post

on:
  schedule:
    - cron: '0 8 * * *'    # 10:00 AM local (Morning Curator News)
    - cron: '30 14 * * *'  # 04:30 PM local (Afternoon Mentor Wisdom)
  workflow_dispatch: # Allows manual trigger from the GitHub UI

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
        
      - name: Run poster
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BLUESKY_USERNAME: ${{ secrets.BLUESKY_USERNAME }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          BLUESKY_PASSWORD: ${{ secrets.BLUESKY_PASSWORD }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
          MASTODON_API_BASE_URL: ${{ secrets.MASTODON_API_BASE_URL }}
          STATE_STORE_URL: ${{ secrets.STATE_STORE_URL }}
          STATE_STORE_TOKEN: ${{ secrets.STATE_STORE_TOKEN }}
        run: python main.py
