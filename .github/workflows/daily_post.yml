name: Daily Bluesky Post

on:
  # Triggered externally by cron-job.org at 09:00 and 15:30 UTC via workflow_dispatch.
  # GitHub's built-in schedule is intentionally removed to avoid duplicate posts and timing delays.
  workflow_dispatch:

concurrency:
  group: daily-post-${{ github.ref }}
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run daily post
        env:
          # Required
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BLUESKY_USERNAME: ${{ secrets.BLUESKY_USERNAME }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          # Optional Mastodon support
          MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
          MASTODON_API_BASE_URL: ${{ secrets.MASTODON_API_BASE_URL }}
          # State persistence via private GitHub Gist
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
          # Cap jitter to 5 min so the Actions runner doesn't idle for 30 min
          POST_JITTER_MIN_SECONDS: 30
          POST_JITTER_MAX_SECONDS: 300
        run: python main.py

      - name: Snapshot Gist state
        if: success()
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
        run: |
          mkdir -p backup
          python - <<'PY'
          import os, httpx
          gist_id = os.environ["GIST_ID"]
          token = os.environ["GIST_TOKEN"]
          resp = httpx.get(
              f"https://api.github.com/gists/{gist_id}",
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
              timeout=15,
          )
          resp.raise_for_status()
          for name, f in resp.json()["files"].items():
              with open(f"backup/{name}", "w", encoding="utf-8") as out:
                  out.write(f["content"])
          PY

      - name: Upload state snapshot
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: gist-state-${{ github.run_id }}
          path: backup/
          retention-days: 90
