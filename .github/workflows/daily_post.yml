name: Daily Bluesky Post

on:
  # Triggered externally by cron-job.org twice daily via workflow_dispatch.
  # Times are anchored to local Belgian time so UTC values shift with DST:
  # 08:00/15:30 UTC in winter (CET), 07:00/14:30 UTC in summer (CEST).
  # GitHub's built-in schedule is intentionally removed to avoid duplicate posts and timing delays.
  workflow_dispatch:
    inputs:
      force_mode:
        description: "Force mode: curator / mentor / strategist (blank = hour-based). Test/validation only."
        required: false
        default: ""
      force_image:
        description: "Force image generation: 1 = always (blank = normal probability). Test/validation only."
        required: false
        default: ""

concurrency:
  group: daily-post-${{ github.ref }}
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 2026-05-13: belt-and-suspenders to the WARN→ERROR promotion in
      # src/utils.py. The bot itself catches Gist write failures and falls
      # back to local-file writes (which are ephemeral on the runner), so
      # without this step a failed PAT scope can silently degrade state
      # persistence for days. This step does a real round-trip write to a
      # dedicated smoke-test file in the Gist, and `raise_for_status` fails
      # the workflow loudly when the PAT loses Gists:Write permission. Same
      # category of explicit check as the existing "Snapshot Gist state"
      # step (which does a READ round-trip).
      - name: Gist write smoke test
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
        run: |
          python - <<'PY'
          import datetime, json, os, sys, httpx
          gist_id = os.environ.get("GIST_ID", "").strip()
          token = os.environ.get("GIST_TOKEN", "").strip()
          if not gist_id or not token:
              print("GIST_ID or GIST_TOKEN missing — skipping smoke test")
              sys.exit(0)
          payload = {
              "files": {
                  "smoke_test.json": {
                      "content": json.dumps(
                          {
                              "at": datetime.datetime.now(datetime.timezone.utc).isoformat(),
                              "run_id": os.environ.get("GITHUB_RUN_ID", "unknown"),
                              "purpose": "Gist write smoke test — proves PAT has Gists:Write permission",
                          },
                          indent=2,
                      )
                  }
              }
          }
          resp = httpx.patch(
              f"https://api.github.com/gists/{gist_id}",
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "Content-Type": "application/json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
              json=payload,
              timeout=15,
          )
          resp.raise_for_status()
          print(f"Gist write smoke test ok — status {resp.status_code}")
          PY

      - name: Run daily post
        env:
          # Required
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BLUESKY_USERNAME: ${{ secrets.BLUESKY_USERNAME }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          # Optional Mastodon support
          MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
          MASTODON_API_BASE_URL: ${{ secrets.MASTODON_API_BASE_URL }}
          # State persistence via private GitHub Gist
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
          # Cap jitter to 5 min so the Actions runner doesn't idle for 30 min
          POST_JITTER_MIN_SECONDS: 30
          POST_JITTER_MAX_SECONDS: 300
          # Manual test/validation hooks (blank on the cron-job.org dispatches)
          FORCE_MODE: ${{ github.event.inputs.force_mode }}
          FORCE_IMAGE: ${{ github.event.inputs.force_image }}
        run: python main.py

      - name: Snapshot Gist state
        if: success()
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
        run: |
          mkdir -p backup
          python - <<'PY'
          import os, httpx
          gist_id = os.environ["GIST_ID"]
          token = os.environ["GIST_TOKEN"]
          resp = httpx.get(
              f"https://api.github.com/gists/{gist_id}",
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
              timeout=15,
          )
          resp.raise_for_status()
          # ALLOWLIST — snapshot only non-sensitive state. This artifact is
          # PUBLIC (public repo => any GitHub user can download it for 90 days),
          # so pending_replies.json (drafted replies + the proactive watchlist
          # of named people, kept secret via the PROACTIVE_REPLY_WATCHLIST
          # secret) must NEVER be included. Anything not listed here is excluded
          # by default, so a future sensitive state file cannot silently leak.
          SAFE_TO_SNAPSHOT = {
              "seen_articles.json",
              "replied_to.json",
              "feed_health.json",
              "post_metrics.json",
              "growth.json",
          }
          for name, f in resp.json()["files"].items():
              if name not in SAFE_TO_SNAPSHOT:
                  print(f"snapshot: skipping non-allowlisted file {name!r}")
                  continue
              with open(f"backup/{name}", "w", encoding="utf-8") as out:
                  out.write(f["content"])
          PY

      - name: Upload state snapshot
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gist-state-${{ github.run_id }}
          path: backup/
          retention-days: 90
