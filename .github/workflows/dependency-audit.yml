name: Dependency audit

# Checks the pinned runtime lockfile (requirements.txt, what production
# installs) against known vulnerabilities in the PyPI advisory database.
#
# It replaces the Snyk PR check removed on 2026-09-11: Snyk scanned the same
# file. It is deliberately NOT a required check (the ruleset on main requires
# `tests` and `lockfile`), so an advisory published against an unchanged pin
# shows up as a red check without blocking unrelated merges.
#
# The schedule was weekly until 2026-10-21, with the comment here claiming the
# weekly run caught advisories published between PRs. It does, up to a week
# late: nine advisories (eight Pillow CVEs, a certifi CA compromise) landed
# overnight on 2026-10-20, the next cron was the following Monday, and what
# actually surfaced them was a docs-only PR failing a check it had nothing to
# do with. Now daily, and the `dependency-audit-issue` job turns a red run into
# one self-closing GitHub issue, because a red check between PRs is a signal
# nobody receives.
#
# `no-deps`: requirements.txt is generated by pip-compile and pins every
# package, transitive ones included, so there is nothing to resolve.

on:
  pull_request:
  push:
    branches: [ main ]
  schedule:
    # Daily, 07:10 UTC. Ten past, to sit clear of the 07:00 daily-post run.
    - cron: "10 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Audit the runtime lockfile
        uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266 # v1.1.0
        with:
          inputs: requirements.txt
          no-deps: true

  # Turns a red audit into one GitHub issue (opened, updated, closed) so an
  # advisory published between PRs reaches a person instead of only colouring a
  # check nobody is looking at. A job of its own so the audit job above keeps a
  # read-only token: this is the only job here that may write issues.
  #
  # Not on pull_request: a PR must not rewrite the shared issue, and the red
  # check is already the signal there. `always()` so it runs when the audit job
  # fails, which is precisely when there is something to report.
  dependency-audit-issue:
    needs: pip-audit
    if: ${{ always() && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: python -m pip install --quiet pip-audit

      # `|| true`: pip-audit exits non-zero when it finds something, and the
      # findings are the point. The JSON is still written. A genuine crash
      # leaves the file missing or malformed, which the reporter treats as "no
      # signal" and leaves the issue untouched rather than closing it.
      - name: Audit the runtime lockfile as JSON
        run: |
          python -m pip_audit -r requirements.txt --no-deps --format json --output audit.json || true

      - name: Open, update or close the dependency-audit issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python -m scripts.report_dependency_audit audit.json
