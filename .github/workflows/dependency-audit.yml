name: Dependency audit

# Checks the pinned runtime lockfile (requirements.txt, what production
# installs) against known vulnerabilities in the PyPI advisory database.
#
# It replaces the Snyk PR check removed on 2026-09-11: Snyk scanned the same
# file. It is deliberately NOT a required check (the ruleset on main requires
# `tests` and `lockfile`), so an advisory published against an unchanged pin
# shows up as a red check without blocking unrelated merges.
#
# The schedule was weekly until 2026-10-21, and this comment claimed the weekly
# run caught advisories published between PRs. It did, up to a week late. Nine
# advisories (eight Pillow CVEs, a certifi CA compromise) landed overnight on
# 2026-10-20 against unchanged pins, the next cron was the following Monday, and
# what actually surfaced them was a docs-only PR failing a check it had nothing
# to do with -- five days of exposure that nobody would have seen. Daily now, so
# the worst case is one day.
#
# The daily schedule landed on its own in #217, which changed only when the
# signal EXISTS: it still arrives as a red check on a scheduled run, and nobody
# is watching the Actions tab on a Tuesday. This is the other half -- the
# `dependency-audit-issue` job turns a red run into one self-closing GitHub
# issue, the same shape scripts/report_feed_health.py uses for dead feeds,
# because a finding that lives only in a run nobody opens is not a finding.
#
# `no-deps`: requirements.txt is generated by pip-compile and pins every
# package, transitive ones included, so there is nothing to resolve.

on:
  pull_request:
  push:
    branches: [ main ]
  schedule:
    # Daily, 07:10 UTC. Ten past, to sit clear of the 07:00 daily-post run.
    - cron: "10 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    # A healthy run takes ~25 seconds. Without this, a genuinely hung audit
    # would sit "pending" for GitHub's default of six hours. #226 turned out
    # not to be a hang (every record reads completed/success), but a bound
    # turns any future one into a red check within minutes.
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Audit the runtime lockfile
        uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266 # v1.1.0
        with:
          inputs: requirements.txt
          no-deps: true

  # Turns a red audit into one GitHub issue (opened, updated, closed) so an
  # advisory published between PRs reaches a person instead of only colouring a
  # check nobody is looking at. A job of its own so the audit job above keeps a
  # read-only token: this is the only job here that may write issues.
  #
  # Not on pull_request: a PR must not rewrite the shared issue, and the red
  # check is already the signal there. `always()` so it runs when the audit job
  # fails, which is precisely when there is something to report.
  dependency-audit-issue:
    needs: pip-audit
    # main only. The condition used to be "not a pull_request", which admitted
    # every workflow_dispatch -- and the branch selector means that run would
    # audit a feature branch while mutating the repository-wide issue, so a
    # clean branch could close an alert that still applies to main and a stale
    # one could reopen a fixed alert (Codex, #215). schedule and push to main
    # both carry refs/heads/main, so nothing real is lost.
    if: ${{ always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Deliberately NOT scoped by github.ref, for the same reason daily_post.yml
    # is not: the state being serialised is one shared GitHub issue, not
    # anything per-ref. Without this, a push to main overlapping the 07:10 cron
    # can have both reporters read "no open issue" before either creates one and
    # both open one -- and a later run manages only the first it finds, so the
    # duplicate stays open even after the lockfile comes back clean. Merging two
    # PRs minutes apart, which happened on 2026-10-21, is enough to race it.
    # cancel-in-progress is false: the second run must still report, not vanish.
    concurrency:
      group: dependency-audit-issue
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write

    steps:
      # Explicitly main, not the triggering SHA. A concurrency group orders jobs
      # by when they START WAITING, which here is after `needs: pip-audit`
      # finishes -- so reporters can reach this group in a different order from
      # their workflow runs, and a late reporter checking out ITS older SHA
      # would write a conclusion about a lockfile main has already moved past
      # (Codex, #215). Auditing main makes every reporter answer the same
      # question, so whichever writes last is still right about main.
      #
      # The trade: a dispatch cannot be used to test a change to this reporter
      # from a branch, because main's copy is what runs. That is the correct
      # direction for a production alert; test the reporter through its tests.
      - name: Checkout main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: main

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      # Pinned, like zizmor in workflow-lint.yml. parse_audit documents and tests
      # one JSON shape (2.10.1, verified); an unattended alert must not adopt a
      # new shape on its own, because shape drift that still parses reads as an
      # empty audit and would CLOSE the issue. Bump deliberately, with the
      # fixture in tests/test_report_dependency_audit.py.
      - name: Install pip-audit
        run: python -m pip install --disable-pip-version-check --quiet pip-audit==2.10.1

      # `|| true`: pip-audit exits non-zero when it finds something, and the
      # findings are the point. The JSON is still written. A genuine crash
      # leaves the file missing or malformed, which the reporter treats as "no
      # signal" and leaves the issue untouched rather than closing it.
      - name: Audit the runtime lockfile as JSON
        run: |
          python -m pip_audit -r requirements.txt --no-deps --format json --output audit.json || true

      - name: Open, update or close the dependency-audit issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python -m scripts.report_dependency_audit audit.json
