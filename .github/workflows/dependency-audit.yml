name: Dependency audit

# Checks the pinned runtime lockfile (requirements.txt, what production
# installs) against known vulnerabilities in the PyPI advisory database.
#
# It replaces the Snyk PR check removed on 2026-09-11: Snyk scanned the same
# file. It is deliberately NOT a required check (the ruleset on main requires
# `tests` and `lockfile`), so an advisory published against an unchanged pin
# shows up as a red check without blocking unrelated merges. The weekly run
# catches advisories published between PRs.
#
# `no-deps`: requirements.txt is generated by pip-compile and pins every
# package, transitive ones included, so there is nothing to resolve.

on:
  pull_request:
  push:
    branches: [ main ]
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Audit the runtime lockfile
        uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266 # v1.1.0
        with:
          inputs: requirements.txt
          no-deps: true
