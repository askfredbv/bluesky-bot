version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Brussels"
    # Weekly version updates are back on (they were security-only from #98 until
    # 2026-10-27). They were switched off because Dependabot's lockfile edits never
    # passed `lockfile`. Example: #96 (2026-08-29) bumped pydantic-core alone,
    # which pydantic pins exactly, giving ResolutionImpossible.
    # Two things keep that from happening again:
    #   1. One group for every minor and patch bump (atproto aside, see the
    #      groups below), so packages that move together (pydantic +
    #      pydantic-core, httpx + httpcore, ...) land in a single weekly PR
    #      instead of a stream of half-PRs.
    #   2. .github/workflows/dependabot-lockfile.yml regenerates both lockfiles
    #      with pip-compile on every Dependabot PR and pushes the result, so the
    #      PR passes `lockfile` by construction.
    # Security-advisory PRs don't count toward this limit and ignore the group.
    open-pull-requests-limit: 2
    # A release must be a week old before Dependabot proposes it: most broken or
    # hijacked releases get yanked within days. Security updates skip the wait.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    groups:
      # atproto alone: it is 0.0.x, so every release can break something, and a
      # type or API problem in it must not hold back the other six bumps (#310
      # sat red for that reason). First match wins, so it is listed first and
      # left out of the group below.
      atproto:
        applies-to: version-updates
        patterns: ["atproto"]
      python-minor-and-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
        exclude-patterns: ["atproto"]
    # Deliberately NO `ignore` for tenacity, although google-genai caps
    # tenacity<9.2.0 (still true for 3.6.1, checked 2026-11-25) and a lone
    # tenacity 9.2.x PR is therefore a no-op (#268): `ignore` also filters
    # security updates, and a tenacity fix that exists only in 9.2+ must stay
    # visible. Close such a PR by hand; in the group it is harmless, the
    # lockfile fix-up regenerates it back to 9.1.4.
    allow:
      # Majors stay a human decision. Every runtime dependency has a ceiling in
      # pyproject.toml (`<2`, `<14`, ...), so a major bump means editing that
      # ceiling and reading the changelog (see the Pillow 13 note there).
      # Dependabot would only bump the lockfile pin, and pip-compile would then
      # pull it straight back under the ceiling.
      # `allow.update-types`, NOT `ignore`: `ignore` also suppresses security
      # updates, so a fix that only exists in a new major would never be
      # proposed. `allow.update-types` limits version updates only.
      - dependency-name: "*"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]

  # Every action in .github/workflows/ is pinned to a commit SHA with a `# vN`
  # comment. A pin nobody updates turns into old code nobody reviewed, so
  # Dependabot proposes the bumps; it rewrites the SHA and the comment together
  # (#307). Same schedule, cooldown, grouping and major-version rule as pip.
  # dependabot-lockfile.yml only fires on requirements*.txt changes, so it
  # leaves these PRs alone.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Brussels"
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions-minor-and-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
    allow:
      - dependency-name: "*"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
