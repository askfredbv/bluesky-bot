version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    # Security-updates only. `open-pull-requests-limit: 0` disables routine
    # version-update PRs; security-advisory PRs are exempt from the limit and
    # still come through (this is the documented mechanism for "security only").
    #
    # Why: Dependabot can't run pip-compile, so it bumps a single (often
    # transitive) pin without resolving the full dependency graph — every
    # routine PR then fails lockfile-check / tests. Example: #96 (2026-08-29)
    # bumped pydantic-core standalone, which pydantic pins, → ResolutionImpossible.
    # Routine minor/major bumps are done by regenerating the pyproject lockfiles
    # (requirements.txt + requirements-dev.txt) by hand when we actually need them.
    open-pull-requests-limit: 0
