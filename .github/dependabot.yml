version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Brussels"
    # Weekly version updates are back on (they were security-only from #98 until
    # 2026-10-27). They were switched off because Dependabot's lockfile edits never
    # passed `lockfile`. Example: #96 (2026-08-29) bumped pydantic-core alone,
    # which pydantic pins exactly, giving ResolutionImpossible.
    # Two things keep that from happening again:
    #   1. One group for every minor and patch bump, so packages that move
    #      together (pydantic + pydantic-core, httpx + httpcore, ...) land in a
    #      single weekly PR instead of a stream of half-PRs.
    #   2. .github/workflows/dependabot-lockfile.yml regenerates both lockfiles
    #      with pip-compile on every Dependabot PR and pushes the result, so the
    #      PR passes `lockfile` by construction.
    # Security-advisory PRs don't count toward this limit and ignore the group.
    open-pull-requests-limit: 2
    # A release must be a week old before Dependabot proposes it: most broken or
    # hijacked releases get yanked within days. Security updates skip the wait.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    groups:
      python-minor-and-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
    ignore:
      # Majors stay a human decision. Every runtime dependency has a ceiling in
      # pyproject.toml (`<2`, `<14`, ...), so a major bump means editing that
      # ceiling and reading the changelog (see the Pillow 13 note there).
      # Dependabot would only bump the lockfile pin, and pip-compile would then
      # pull it straight back under the ceiling. Security fixes are not affected.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
